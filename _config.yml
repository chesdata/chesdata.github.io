title: Chapel Hill Expert Survey
description: Expert survey estimates of political party positioning on ideology and policy.
url: "https://www.chesdata.eu"
baseurl: ""

# Contact address used in the footer and on the contact page.
email: chesdata@gmail.com

# Bluesky handle, without the leading @. Used to build the profile link in the
# footer and on the contact page.
bluesky: chesdata.bsky.social

# GoatCounter analytics. Registered site code; dashboard is at
# https://chesdata.goatcounter.com
# Set this to empty to switch tracking off site-wide.
goatcounter_code: chesdata

# The GitHub repo that holds the data files as Releases.
data_repo: chesdata/chesdata.github.io
# Landing page for all data downloads. Individual file links on the data
# pages should eventually point at specific release assets instead.
data_repo_url: "https://github.com/chesdata/chesdata.github.io/releases"

# Link to the interactive Shiny app (hosted separately).
shiny_url: "https://chesdata.shinyapps.io/Shiny-CHES/"

# Navigation. Order here is the order in the header.
#
# Labels are deliberately short. With eight items plus the CHES Interactive link, the fully spelled-out versions ("CHES-Latin America", "CHES-South Asia") overflow the header on a laptop screen. Every item already sits under the CHES wordmark, so the prefix is redundant here. Page titles are unaffected — those come from each file's own front matter.

#
# The team page is intentionally NOT in this list. It still builds and lives at
# /our-team/, but nothing links to it — not the footer, not the survey pages.
# This comment used to claim otherwise; checked 7 August 2026 and it was wrong.
# Add a `- title: Team / url: /our-team/` entry here if you want it reachable.
nav:
  - title: About
    url: /
  - title: Europe
    url: /ches-europe/
  - title: Latin America
    url: /ches-la/
  - title: Israel
    url: /ches-israel/
  - title: Canada
    url: /ches-canada/
  - title: South Asia
    url: /ches-southasia/
  - title: USA
    url: /ches-usa/
  - title: SPEED-CHES
    url: /speed-ches/

exclude:
  - README.md
  - DATA-FILES-TO-RESCUE.md
  - DNS-CUTOVER.md
  - Gemfile
  - Gemfile.lock
  - _preview
  - build-preview.py
  - check-links.sh
  - urls.txt

# Jekyll defaults
markdown: kramdown
plugins:
  - jekyll-sitemap
